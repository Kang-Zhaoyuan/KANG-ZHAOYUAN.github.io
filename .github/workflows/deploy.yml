name: Deploy Astro site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch original Flipo simulation GIF
        run: |
          mkdir -p public/media
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Kang-Zhaoyuan/Flipo_Flip/main/03_%E7%AD%94%E8%BE%A9%E4%B8%8E%E6%B1%87%E6%8A%A5/v2_%E7%AD%94%E8%BE%A9%E4%B8%8E%E6%B1%87%E6%8A%A5/References_On_PPT_Making/Simulation/GIF3_GroupA_omega0_15.0rads_success810deg_0.4x_smooth.gif" \
            -o public/media/flipo-simulation.gif
          test "$(wc -c < public/media/flipo-simulation.gif)" -gt 1000000
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
